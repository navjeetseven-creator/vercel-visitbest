  <text x="600" y="375" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">VISITBEST EDITORIAL FRAMEWORK • ALL STAGES REGULATED BY FORMAL SLA &amp; LEGAL AGREEMENTS</text>
