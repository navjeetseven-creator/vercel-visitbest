<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <rect width="1200" height="750" fill="#ffffff" rx="16" stroke="#cbd5e1" stroke-width="2"/>
  
  <text x="600" y="55" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">GEOGRAPHIC DISTRIBUTION OF TOP 20 EVENT HUBS</text>
  <text x="600" y="88" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Audited Headquarters &amp; Primary Operational Bases Across India</text>
  
  <!-- Map Graphic Area -->
  <g transform="translate(180, 110)">
    <!-- Stylized India outline polygon -->
    <path d="M 320,40 L 370,25 L 420,65 L 440,120 L 510,160 L 610,170 L 620,210 L 560,240 L 550,280 L 590,320 L 550,360 L 470,390 L 430,470 L 370,550 L 320,620 L 290,590 L 270,510 L 210,440 L 190,350 L 150,290 L 200,240 L 250,210 L 290,130 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
    
    <!-- Connection lines connecting main hubs -->
    <line x1="320" y1="160" x2="210" y2="400" stroke="#c25e1a" stroke-width="3" stroke-dasharray="6 6"/>
    <line x1="210" y1="400" x2="290" y2="520" stroke="#c25e1a" stroke-width="3" stroke-dasharray="6 6"/>
    <line x1="320" y1="160" x2="290" y2="520" stroke="#c25e1a" stroke-width="3" stroke-dasharray="6 6"/>
    <line x1="210" y1="400" x2="190" y2="310" stroke="#c25e1a" stroke-width="3" stroke-dasharray="6 6"/>
    <line x1="320" y1="160" x2="240" y2="240" stroke="#c25e1a" stroke-width="3" stroke-dasharray="6 6"/>
    
    <!-- City Hub Pins -->
    <!-- Delhi NCR -->
    <g transform="translate(320, 160)">
      <circle cx="0" cy="0" r="14" fill="#c25e1a"/>
      <circle cx="0" cy="0" r="24" fill="#c25e1a" opacity="0.25"/>
      <text x="35" y="5" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Delhi NCR (6 Agencies)</text>
      <text x="35" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Touchwood, WDC, Inventum, Alchemist, Vibgyor, Showmakerz</text>
    </g>
    
    <!-- Mumbai -->
    <g transform="translate(210, 400)">
      <circle cx="0" cy="0" r="16" fill="#0f172a"/>
      <circle cx="0" cy="0" r="28" fill="#0f172a" opacity="0.25"/>
      <text x="-40" y="5" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="end">Mumbai (10 Agencies)</text>
      <text x="-40" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="end">Wizcraft, Percept, 70 EMG, Showhouse, Shaadi Squad, Motwane...</text>
    </g>
    
    <!-- Bengaluru -->
    <g transform="translate(290, 520)">
      <circle cx="0" cy="0" r="12" fill="#0d9488"/>
      <circle cx="0" cy="0" r="22" fill="#0d9488" opacity="0.25"/>
      <text x="35" y="5" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Bengaluru (1 Agency)</text>
      <text x="35" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">LSD Events (Tech Ecosystem &amp; Unicorn Offsites)</text>
    </g>
    
    <!-- Ahmedabad / Gujarat -->
    <g transform="translate(190, 310)">
      <circle cx="0" cy="0" r="12" fill="#0284c7"/>
      <circle cx="0" cy="0" r="22" fill="#0284c7" opacity="0.25"/>
      <text x="-35" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="end">Ahmedabad (1)</text>
      <text x="-35" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="end">AUM Event &amp; Promotions (Western India)</text>
    </g>
    
    <!-- Rajasthan (Udaipur) -->
    <g transform="translate(240, 240)">
      <circle cx="0" cy="0" r="12" fill="#eab308"/>
      <circle cx="0" cy="0" r="22" fill="#eab308" opacity="0.25"/>
      <text x="-35" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="end">Udaipur, Rajasthan (1)</text>
      <text x="-35" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="end">Magic Lights (Lake Palace Destination Weddings)</text>
    </g>
  </g>
  
  <text x="600" y="725" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">VISITBEST VERIFIED HUB AUDIT • 100% OF AGENCIES DELIVER PAN-INDIA &amp; INTERNATIONAL DESTINATIONS</text>
</svg>