<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <rect width="1200" height="650" fill="#ffffff" rx="16" stroke="#cbd5e1" stroke-width="2"/>
  
  <text x="600" y="55" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">TYPICAL EVENT BUDGET ALLOCATION IN INDIA</text>
  <text x="600" y="88" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Standard Cost Distribution for High-Scale Corporate Conventions &amp; Turnkey Weddings</text>
  
  <!-- Donut Chart -->
  <g transform="translate(320, 350)">
    <!-- 35% Production, Staging & AV -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#c25e1a" stroke-width="75" stroke-dasharray="373 1068" stroke-dashoffset="0"/>
    <!-- 25% Venue & Catering -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#0f172a" stroke-width="75" stroke-dasharray="267 1068" stroke-dashoffset="-373"/>
    <!-- 15% Décor & Florals -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#0d9488" stroke-width="75" stroke-dasharray="160 1068" stroke-dashoffset="-640"/>
    <!-- 12% Artist, Celebrities & Entertainment -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#eab308" stroke-width="75" stroke-dasharray="128 1068" stroke-dashoffset="-800"/>
    <!-- 8% Management Fee -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#6366f1" stroke-width="75" stroke-dasharray="85 1068" stroke-dashoffset="-928"/>
    <!-- 5% Contingency & Permits -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#64748b" stroke-width="75" stroke-dasharray="55 1068" stroke-dashoffset="-1013"/>
    
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#0f172a" text-anchor="middle">100%</text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#475569" text-anchor="middle">TOTAL BUDGET</text>
  </g>
  
  <!-- Legend Table -->
  <g transform="translate(680, 140)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#c25e1a"/>
      <text x="48" y="24" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Production, Staging &amp; AV (35%)</text>
      <text x="48" y="48" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Trussing, LED curved walls, line arrays, digital consoles, gensets</text>
    </g>
    
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#0f172a"/>
      <text x="48" y="24" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Venue Rental &amp; Hospitality (25%)</text>
      <text x="48" y="48" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Convention halls, hotel banquets, banquet catering minimums</text>
    </g>
    
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#0d9488"/>
      <text x="48" y="24" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Thematic Décor &amp; Fabrication (15%)</text>
      <text x="48" y="48" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Floral mandap styling, experiential expo pavilions, custom props</text>
    </g>
    
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#eab308"/>
      <text x="48" y="24" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Artistes &amp; Entertainment (12%)</text>
      <text x="48" y="48" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Celebrity hosts, live bands, international DJs, technical riders</text>
    </g>
    
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#6366f1"/>
      <text x="48" y="24" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Agency Management Fee (8%)</text>
      <text x="48" y="48" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Turnkey project director, on-ground marshals, run-of-show cues</text>
    </g>
    
    <g transform="translate(0, 375)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#64748b"/>
      <text x="48" y="24" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Permits, Insurance &amp; Buffer (5%)</text>
      <text x="48" y="48" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">PPL/IPRS copyright licensing, third-party liability &amp; police NOCs</text>
    </g>
  </g>
  
  <text x="600" y="625" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">SOURCE: VISITBEST COMMERCIAL EVENT RESEARCH • 2026 BENCHMARKS</text>
</svg>