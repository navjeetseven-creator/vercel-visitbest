  <!-- Bottom Verification Bar -->
  <rect x="60" y="575" width="32" height="32" rx="16" fill="#10b981"/>
  <text x="76" y="598" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
