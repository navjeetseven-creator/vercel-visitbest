      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#grad_marrymeweddings)"/>
  
  <line x1="60" y1="110" x2="1140" y2="110" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="60" y1="540" x2="1140" y2="540" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Top Badges -->
  <rect x="60" y="45" width="450" height="42" rx="8" fill="#fb7185" fill-opacity="0.18" stroke="#fb7185" stroke-width="2"/>
  <text x="80" y="72" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fb7185" letter-spacing="1.5">DESTINATION &amp; COASTAL WEDDINGS</text>
  
  <rect x="880" y="45" width="260" height="42" rx="8" fill="#ffffff" fill-opacity="0.12"/>
  <text x="1010" y="72" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Est. 2009 • Mumbai / Goa</text>
  
  <!-- Main Company Title -->
  <text x="60" y="230" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Marry Me - Wedding Planners</text>
  
  <!-- Primary Feature Tag Pill -->
