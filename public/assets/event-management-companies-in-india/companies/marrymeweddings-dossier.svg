  <!-- Middle Editorial Statement -->
  <text x="60" y="405" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9">Official Commercial Dossier &amp; Verified Agency Profile</text>
